[project]
name = "knowledge-tracing"
version = "0.1.0"
description = "Student modelling from answer logs: BKT, PFA, IRT and DKT from scratch, evaluated split by student."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "knowledge-tracing", "bkt", "dkt", "irt", "pfa", "student-modelling",
    "educational-data-mining", "assistments", "adaptive-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# numpy is the only runtime dependency: every model (including the LSTM and its
# backward pass) is written against it directly.
dependencies = ["numpy>=1.26"]

[project.scripts]
kt = "kt.cli:main"

[project.urls]
Homepage = "https://github.com/hammasbuilds/knowledge-tracing"

[dependency-groups]
dev = ["pytest>=8", "ruff==0.16.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
